[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "fathomnet-pu"
version = "0.1.0"
description = "Positive-unlabeled object detection for FathomNetCLEF2026 @ LifeCLEF & CVPR-FGVC"
requires-python = ">=3.9"

[tool.setuptools.packages.find]
include = ["src*"]

[tool.setuptools.package-dir]
"" = "."
